name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The devDependencies link into a DeepSeek Harness checkout that sits
      # next to this repository (link:../deepseek-harness/...), so check it
      # out at the same relative position and build the host libs it needs.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install harness dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build harness host libs
        working-directory: deepseek-harness
        run: npm run build:lib:host

      # vendor/cordis is not part of build:lib:host and its lib/ is untracked;
      # build it explicitly so the linked @deepseek-ai/cordis resolves.
      - name: Build vendor cordis
        working-directory: deepseek-harness/vendor/cordis
        run: |
          pnpm install --no-save
          pnpm exec tsc -b tsconfig.json

      - name: Diagnose linked packages
        run: |
          ls node_modules/@deepseek-ai/ | head -20
          ls deepseek-harness/vendor/cordis/lib | head -5
          ls deepseek-harness/packages/core/agent/lib | head -5
          node -e "console.log(require.resolve('@deepseek-ai/cordis'))" | head -2

      - name: Install plugin dependencies
        run: |
          pnpm --version
          pnpm install --no-frozen-lockfile
          ls -la node_modules/ | head -12
          ls node_modules/@deepseek-ai/ | head -20

      - name: Verify (typecheck + build + smoke + flow + functional suite + icons)
        run: pnpm verify
