name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The devDependencies link into a DeepSeek Harness checkout that sits
      # next to this repository (link:./deepseek-harness/...), so check it
      # out at the same relative position and build the host libs it needs.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install harness dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build harness host libs
        working-directory: deepseek-harness
        run: npm run build:lib:host

      - name: Install plugin dependencies
        run: |
          pnpm --version
          pnpm install --no-frozen-lockfile
          ls node_modules/@deepseek-ai/ | head -20

      - name: Emit plugin JS (type drift against upstream harness is informational)
        run: |
          node scripts/clean-build.mjs
          npx tsc -p tsconfig.json || true
          npx tsc -p tsconfig.client.json || true
          npx tsdown

      # Runtime verification face: the bundles are exercised against the
      # linked host libs. Typecheck is informational here — the full strict
      # pass pins the patched harness checkout this plugin targets (local
      # stack) and is part of the local `pnpm verify` gate.
      - name: Runtime verification (smoke + flow + functional suite + icons)
        run: |
          pnpm smoke:client
          pnpm verify:flow
          node scripts/full-functional-test.mjs
          pnpm verify:icons

      - name: Typecheck against upstream harness types (informational)
        continue-on-error: true
        run: pnpm typecheck
